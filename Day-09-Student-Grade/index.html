<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Student Grade Practice</title>
</head>
<body>
  <script>
  let marks=92;
  let grade;
  if(marks >= 90 && marks <= 100) {
    grade= "A";
  } else if(marks >=70 && marks <= 89) {
    grade="B";
  } else if(marks >= 60 && marks <= 69){
    grade="C";
  } else if(marks >= 50 && marks <= 59) {
    grade="D";
  } else if(marks >=  0 && marks <= 49) {
    grade="F";
  }
    document.write("According to your marks,your grade was:",grade);
  
    </script>
</body>
</html>
